<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin login</title>
</head>
<body style="font-family:sans-serif;padding:20px;max-width:400px;margin:auto">
<h2>Admin login</h2>
<input id="pw" type="password" placeholder="Password" style="width:100%;padding:10px;font-size:16px;box-sizing:border-box">
<button id="go" style="margin-top:10px;padding:10px 20px;font-size:16px">Login</button>
<p id="out"></p>
<script>
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out');
  out.textContent = '...';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value })
    });
    const d = await r.json();
    out.textContent = r.ok ? 'Login OK. Token received.' : 'Failed: ' + (d.error || r.status);
  } catch (e) {
    out.textContent = 'Error: ' + e.message;
  }
};
</script>
</body>
</html>
