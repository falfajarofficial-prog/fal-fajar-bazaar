<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orders</title>
<style>
body{font-family:sans-serif;margin:0;padding:16px;background:#f5f7fa;color:#1f2937}
.box{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.new{border:2px solid #f59e0b;background:#fffbeb}
.banner{background:#f59e0b;color:#fff;font-weight:bold;padding:12px;border-radius:8px;margin-bottom:12px;display:none}
input{padding:8px;font-size:16px;box-sizing:border-box;width:100%;margin-bottom:8px}
button{padding:8px 12px;font-size:14px;margin-top:6px;border:0;border-radius:6px;background:#1e3a5f;color:#fff;cursor:pointer}
button.gray{background:#6b7280}
.items{font-size:14px;color:#4b5563;margin:4px 0}
.st{font-size:12px;padding:2px 6px;border-radius:4px;background:#e5e7eb}
</style>
</head>
<body>
<h2>Orders</h2>

<div id="login" class="box" style="display:none">
  <input id="pw" type="password" placeholder="Admin password">
  <button id="go">Login</button>
  <div id="lmsg"></div>
</div>

<div id="panel" style="display:none">
  <div id="banner" class="banner"></div>
  <div class="box">
    <button id="reload">Reload</button>
    <button id="logout" class="gray">Logout</button>
    <div id="msg"></div>
  </div>
  <div id="list"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const SK = 'ffb_admin_token';
const STATUSES = ['pending', 'processing', 'shipped', 'delivered', 'cancelled'];
const BASE_TITLE = 'Orders';
let token = sessionStorage.getItem(SK) || '';
let timer = null;

function showLogin(msg) {
  $('login').style.display = 'block';
  $('panel').style.display = 'none';
  $('list').innerHTML = '';
  $('lmsg').textContent = msg || '';
  stopAuto();
}

function showPanel() {
  $('login').style.display = 'none';
  $('panel').style.display = 'block';
  loadOrders();
  startAuto();
}

function startAuto() {
  stopAuto();
  timer = setInterval(() => { if (token) loadOrders(); }, 60000);
}
function stopAuto() {
  if (timer) clearInterval(timer);
  timer = null;
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) {
    token = '';
    sessionStorage.removeItem(SK);
    showLogin('Session expired. Login again.');
    throw new Error('401');
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}

$('go').onclick = async () => {
  $('lmsg').textContent = '...';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    token = d.token;
    sessionStorage.setItem(SK, token);
    $('pw').value = '';
    showPanel();
  } catch (e) {
    $('lmsg').textContent = 'Failed: ' + e.message;
  }
};

$('logout').onclick = () => {
  token = '';
  sessionStorage.removeItem(SK);
  showLogin('Logged out.');
};

$('reload').onclick = () => loadOrders();

async function setStatus(id, status) {
  $('msg').textContent = 'Saving...';
  try {
    await api('/api/admin-orders', { method: 'POST', body: JSON.stringify({ id, status }) });
    $('msg').textContent = 'Saved.';
    loadOrders();
  } catch (e) {
    if (e.message !== '401') $('msg').textContent = 'Error: ' + e.message;
  }
}

async function loadOrders() {
  try {
    const orders = await api('/api/admin-orders');
    const newCount = orders.filter(o => o.status === 'pending').length;

    $('banner').style.display = newCount ? 'block' : 'none';
    $('banner').textContent = newCount + ' new order' + (newCount === 1 ? '' : 's') + ' waiting';
    document.title = newCount ? '(' + newCount + ') ' + BASE_TITLE : BASE_TITLE;

    orders.sort((a, b) => (b.status === 'pending') - (a.status === 'pending'));

    if (!orders.length) { $('list').textContent = 'No orders yet.'; return; }
    $('list').innerHTML = '';
    orders.forEach(o => {
      const row = document.createElement('div');
      row.className = 'box' + (o.status === 'pending' ? ' new' : '');

      const head = document.createElement('b');
      head.textContent = o.id + ' · ' + o.total_afn + ' AFN';

      const who = document.createElement('div');
      who.textContent = o.customer_name + ' · ' + o.phone + ' · ' + o.city;

      const addr = document.createElement('div');
      addr.textContent = o.address;

      const items = document.createElement('div');
      items.className = 'items';
      items.textContent = o.items.map(i => i.title + ' × ' + i.qty + ' (' + i.price_afn + ' AFN)').join('; ') || 'No items';

      const st = document.createElement('span');
      st.className = 'st';
      st.textContent = o.status;

      const sel = document.createElement('select');
      STATUSES.forEach(s => {
        const op = document.createElement('option');
        op.value = s;
        op.textContent = s;
        if (s === o.status) op.selected = true;
        sel.appendChild(op);
      });
      const save = document.createElement('button');
      save.textContent = 'Save status';
      save.onclick = () => setStatus(o.id, sel.value);

      row.append(head, who, addr, items, st, document.createElement('br'), sel, save);
      $('list').appendChild(row);
    });
  } catch (e) {
    if (e.message !== '401') $('list').textContent = 'Error: ' + e.message;
  }
}

if (token) showPanel(); else showLogin('');
</script>
</body>
</html>
